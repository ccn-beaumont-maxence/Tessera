dimension: 3d
scripts: [./game.tess]
systems: [Grow, Walk, CameraFollow, Bob, Collect, Awaken, ShowHud, ShowTitle]
input:
  move: { left: [KeyA, ArrowLeft], right: [KeyD, ArrowRight], up: [KeyW, ArrowUp], down: [KeyS, ArrowDown], stick: PadLeft }
  jump: [Space, PadA]
  run: [ShiftLeft, PadRT]
physics: { gravity: [0, -18] }
resources:
  Forest: {}
  Quest: {}

prefabs:
  Trunk:
    Transform3D: {}
    Mesh: { shape: cylinder, size: [0.5, 4, 0.5], color: '#3b2a3f' }
  Leaves:
    Transform3D: {}
    Mesh: { shape: sphere, size: [2.4, 2, 2.4], color: '#2a6f6b' }
  Pine:
    Transform3D: {}
    Mesh: { shape: cone, size: [2.6, 2.4, 2.6], color: '#1f4e5a' }
  Grass:
    Transform3D: {}
    Mesh: { shape: cone, size: [0.15, 0.6, 0.15], color: '#3f7a5c' }
  Rock:
    Transform3D: {}
    Mesh: { shape: sphere, size: [1, 0.6, 0.8], color: '#4a4a63', roughness: 1 }
  Stem:
    Transform3D: {}
    Mesh: { shape: cylinder, size: [0.12, 0.4, 0.12], color: '#e8dccb' }
  Cap:
    Transform3D: {}
    Mesh: { shape: sphere, size: [0.45, 0.2, 0.45], color: '#ff5fd2', emissive: 1.4 }
  Crystal:
    Transform3D: {}
    Mesh: { shape: box, size: [0.35, 1.4, 0.35], color: '#6fe7ff', emissive: 1.2, roughness: 0.1, metalness: 0.3 }
  Glow:
    Transform3D: {}
    Light: { kind: point, color: '#ff7ce0', intensity: 3 }
  Fireflies:
    Transform3D: {}
    Particles: { rate: 3, lifetime: 5, speed: 0.4, spread: 6.3, gravity: -0.05, color: '#f6ff8a', endColor: '#7dffb0', size: 0.09, endSize: 0, max: 20 }
  Orb:
    Transform3D: {}
    Mesh: { shape: sphere, size: [0.5, 0.5, 0.5], color: '#ffe38a', emissive: 3 }
    Collider: { shape: sphere, size: [1.2, 1.2, 1.2], sensor: true }
    Particles: { rate: 8, lifetime: 1.2, speed: 0.3, spread: 6.3, gravity: -0.4, color: '#fff3b0', endColor: '#ff9ef0', size: 0.1, max: 12 }
    Orb: {}
  OrbLight:
    Transform3D: {}
    Light: { kind: point, color: '#ffd98a', intensity: 2 }
  Sparkle:
    Transform3D: {}
    Particles: { rate: 0, burst: 40, lifetime: 1, speed: 4, spread: 6.3, gravity: -1, color: '#fff3b0', endColor: '#ff7ce0', size: 0.15 }
    Timer: { duration: 1.2, destroy: true }

entities:
  - name: Camera
    Transform3D: { position: [0, 4, 20.5] }
    Camera3D: { fov: 60, background: '#0c0a1d', fog: 42, bloom: 0.9 }
    Follow: {}
  - name: Moon
    Transform3D: { rotation: [-0.9, 0.6, 0] }
    Light: { color: '#8fa3ff', intensity: 1.3 }
  - name: Ambient
    Light: { kind: ambient, color: '#6a5bb0', intensity: 1 }
  - name: Ground
    Transform3D: { position: [0, -0.5, 0] }
    Mesh: { size: [140, 1, 140], color: '#24403a' }
    Collider: { size: [140, 1, 140] }
  - name: Heartwood                # the great tree in the clearing; wakes up when every orb is found
    Transform3D: {}
    Mesh: { shape: cylinder, size: [1.6, 9, 1.6], color: '#4a3150' }
    Collider: { shape: box, size: [1.6, 9, 1.6] }
    children:
      - { name: Crown, Transform3D: { position: [0, 6, 0] }, Mesh: { shape: sphere, size: [7, 4.5, 7], color: '#c58bff', emissive: 0.15 }, Crown: {} }
      - { name: CrownW, Transform3D: { position: [-3, 4.6, 1] }, Mesh: { shape: sphere, size: [4, 3, 4], color: '#a46bff', emissive: 0.15 }, Crown: {} }
      - { name: CrownE, Transform3D: { position: [3, 4.9, -1] }, Mesh: { shape: sphere, size: [4.5, 3.2, 4.5], color: '#e08bff', emissive: 0.15 }, Crown: {} }
      - { name: CrownTop, Transform3D: { position: [0.5, 8.4, 0.5] }, Mesh: { shape: sphere, size: [4, 3, 4], color: '#ffa8f0', emissive: 0.15 }, Crown: {} }
      - { name: CrownLight, Transform3D: { position: [0, 4, 0] }, Light: { kind: point, color: '#c58bff', intensity: 0 }, Crown: {} }
      - { name: Petals, Transform3D: { position: [0, 6, 0] }, Particles: { rate: 0, lifetime: 6, speed: 1.5, spread: 6.3, gravity: 0.3, color: '#ffd1f7', endColor: '#c58bff', size: 0.18, max: 300 }, Crown: {} }
  - name: Hud
    Transform2D: { position: [-0.95, 0.9] }
    Text: { screen: true, align: left, size: 0.55, color: '#ffe9b8' }
    Hud: {}
  - name: Title
    Transform2D: { position: [0, 0.6] }
    Text: { screen: true, align: center, size: 0.9, color: '#ffd1f7' }
    Title: {}
  - name: Wanderer
    Transform3D: { position: [0, 1, 14] }
    Mesh: { shape: capsule, size: [0.7, 0.7, 0.7], color: '#4b5fa8', roughness: 0.6 }   # capsule mesh height = 2 × size.y
    RigidBody: { lockRotation: true }
    Collider: { shape: capsule, size: [0.7, 1.4, 0.7] }
    Wanderer: {}
    children:
      - { name: Hood, Transform3D: { position: [0, 0.85, 0] }, Mesh: { shape: cone, size: [0.6, 0.6, 0.6], color: '#4b5fa8' } }
      - { name: Lantern, Transform3D: { position: [0.45, 0.1, -0.35] }, Mesh: { shape: sphere, size: [0.22, 0.22, 0.22], color: '#ffc46b', emissive: 3 } }
      - { name: LanternLight, Transform3D: { position: [0.45, 0.3, -0.35] }, Light: { kind: point, color: '#ffb35c', intensity: 4 } }
