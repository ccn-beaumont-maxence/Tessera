dimension: 2d
scripts: [./game.ts]
systems: [PlayerControl, Collect]
input:
  move: { left: [KeyA, ArrowLeft], right: [KeyD, ArrowRight], stick: PadLeft }
  jump: [Space, KeyW, ArrowUp, PadA]
physics: { gravity: [0, -20] }
prefabs:
  Coin:
    Transform2D: {}
    Sprite: { size: [0.4, 0.4], color: '#ffd166', layer: 1 }
    Collider: { shape: sphere, size: [0.4, 0.4], sensor: true }
    Coin: {}
  Block:
    Transform2D: {}
    Sprite: { color: '#3a7d44' }
    Collider: {}

entities:
  - name: Camera
    Transform2D: { position: [0, 2.5] }
    Camera2D: { height: 9 }
  - name: Player
    Transform2D: { position: [-4, 1] }
    Sprite: { image: ./hero.png, columns: 4, pixelsPerUnit: 16, layer: 2 }
    SpriteAnimation: { frames: [0, 1, 2, 1], fps: 6 }
    RigidBody: { lockRotation: true }
    Collider: { shape: capsule, size: [0.8, 1] }
    Player: {}
  - name: Ground
    prefab: Block
    Transform2D: { position: [0, -0.5] }
    Sprite: { size: [16, 1] }
    Collider: { size: [16, 1] }
  - name: Ledge
    prefab: Block
    Transform2D: { position: [2, 2] }
    Sprite: { size: [3, 0.4] }
    Collider: { size: [3, 0.4] }
  - { prefab: Coin, Transform2D: { position: [-1, 0.5] } }
  - { prefab: Coin, Transform2D: { position: [0, 0.5] } }
  - { prefab: Coin, Transform2D: { position: [2, 2.7] } }
