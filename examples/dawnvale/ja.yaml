# Quests
"Wolves at the Gate": "門前のオオカミ"
"Young Wolves slain": "若いオオカミを倒した"
"Wolves have come down from the hills and prowl\nthe meadow west of the abbey. Slay 8 Young Wolves.": "丘から下りてきたオオカミが、修道院の西の草地を\nうろついている。若いオオカミを8匹倒してくれ。"
"Well fought. The brothers can walk the meadow again.": "見事な戦いだった。これで修道士たちも草地を歩ける。"
"Kobold Diggers": "コボルドの採掘者"
"Kobold Diggers slain": "コボルドの採掘者を倒した"
"Kobolds are tunneling under the northeast hills.\nDrive them back: slay 10 Kobold Diggers.": "コボルドが北東の丘の下を掘り進めている。\n追い払ってくれ：コボルドの採掘者を10体倒すのだ。"
"That will slow their digging. You learn fast.": "これで奴らの採掘も遅れるだろう。覚えが早いな。"
"Stolen Candles": "盗まれたろうそく"
"Wax Candles": "ろうそく"
"The kobolds stole our chapel candles and wear them\non their heads! Bring back 8 Wax Candles.": "コボルドが礼拝堂のろうそくを盗んで、頭に\nのせているのです！ろうそくを8本取り返してください。"
"Bless you. The chapel will be bright tonight.": "あなたに祝福を。今夜の礼拝堂は明るくなります。"
"The Grape Harvest": "ブドウの収穫"
"Grape Baskets": "ブドウのかご"
"My back is not what it was. Pick up 6 baskets\nof grapes in the vineyard behind me (F).": "腰がもう昔のようにはいかなくてな。後ろのブドウ畑で\nブドウのかごを6つ拾ってきてくれ（F）。"
"Fine grapes! The abbey wine will be good this year.": "いいブドウだ！今年の修道院のワインはうまくなるぞ。"
"Report to the Sergeant": "軍曹への報告"
"Report": "報告書"
"Take my report to Sergeant Hale in Goldbrook,\ndown the south road.": "この報告書を、南の街道の先にある\nゴールドブルックのヘイル軍曹に届けてくれ。"
"Rowan sent you? Good. I have work for a sword like yours.": "ローワンの使いか？ちょうどいい。お前のような剣士に頼みたい仕事がある。"
"Grimtooth": "グリムトゥース"
"Grimtooth slain": "グリムトゥースを倒した"
"The kobolds answer to a brute called Grimtooth who\nguards the mine mouth. End him.": "コボルドどもはグリムトゥースという荒くれ者に従っている。\n奴は坑道の入口を守っている。仕留めてこい。"
"Grimtooth is dead? The valley owes you, hero.": "グリムトゥースを倒したのか？この谷はお前に借りができたな、英雄よ。"
