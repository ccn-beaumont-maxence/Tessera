"WASD move  Q/E strafe  Space jump  Tab or click: target  1 Strike  F talk/gather": "WASD 移動  Q/E 横移動  Space ジャンプ  Tab/クリック ターゲット  1 ストライク  F 会話/採集"
"{0} complete!": "{0} 達成！"
"Return to {0}.": "{0}に報告しよう。"
"[{0} completed: +{1} xp]": "［{0} 完了：経験値 +{1}］"
"Light be with you, friend.": "光があなたと共にありますように。"
"You have no use for that yet.": "今はまだ使い道がない。"
"You have reached level {0}!": "レベル {0} になった！"
"You wake up at the abbey.": "修道院で目を覚ました。"
"You have died.": "あなたは倒れた。"
"+{0} xp": "経験値 +{0}"
"Welcome to Dawnvale. Speak with Captain Rowan at the abbey gate (F).": "ドーンヴェイルへようこそ。修道院の門にいるローワン隊長に話しかけよう（F）。"

# People and creatures
"Captain Rowan": "ローワン隊長"
"Sister Mira": "シスター・ミラ"
"Farmer Tobbin": "農夫トビン"
"Sergeant Hale": "ヘイル軍曹"
"Young Wolf": "若いオオカミ"
"Kobold Digger": "コボルドの採掘者"
