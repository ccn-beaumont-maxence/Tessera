# Quests
"Wolves at the Gate": "문 앞의 늑대"
"Young Wolves slain": "처치한 어린 늑대"
"Wolves have come down from the hills and prowl\nthe meadow west of the abbey. Slay 8 Young Wolves.": "언덕에서 내려온 늑대들이 수도원 서쪽 풀밭을\n어슬렁거리고 있네. 어린 늑대 8마리를 처치해 주게."
"Well fought. The brothers can walk the meadow again.": "잘 싸웠네. 이제 수사들이 다시 풀밭을 걸을 수 있겠군."
"Kobold Diggers": "코볼트 광부"
"Kobold Diggers slain": "처치한 코볼트 광부"
"Kobolds are tunneling under the northeast hills.\nDrive them back: slay 10 Kobold Diggers.": "코볼트들이 북동쪽 언덕 아래로 굴을 파고 있네.\n놈들을 몰아내게: 코볼트 광부 10마리를 처치하게."
"That will slow their digging. You learn fast.": "이제 놈들의 굴 파기가 늦어지겠군. 배우는 게 빠르군."
"Stolen Candles": "도둑맞은 양초"
"Wax Candles": "양초"
"The kobolds stole our chapel candles and wear them\non their heads! Bring back 8 Wax Candles.": "코볼트들이 예배당 양초를 훔쳐서 머리에\n쓰고 다녀요! 양초 8개를 되찾아 주세요."
"Bless you. The chapel will be bright tonight.": "축복이 있기를. 오늘 밤 예배당이 환하겠네요."
"The Grape Harvest": "포도 수확"
"Grape Baskets": "포도 바구니"
"My back is not what it was. Pick up 6 baskets\nof grapes in the vineyard behind me (F).": "허리가 예전 같지 않아서 말이야. 내 뒤 포도밭에서\n포도 바구니 6개를 주워 주게 (F)."
"Fine grapes! The abbey wine will be good this year.": "좋은 포도로군! 올해 수도원 포도주는 맛있겠어."
"Report to the Sergeant": "하사에게 보고"
"Report": "보고서"
"Take my report to Sergeant Hale in Goldbrook,\ndown the south road.": "이 보고서를 남쪽 길 아래 골드브룩에 있는\n헤일 하사에게 전해 주게."
"Rowan sent you? Good. I have work for a sword like yours.": "로완이 보냈나? 좋아. 자네 같은 검사에게 맡길 일이 있지."
"Grimtooth": "그림투스"
"Grimtooth slain": "처치한 그림투스"
"The kobolds answer to a brute called Grimtooth who\nguards the mine mouth. End him.": "코볼트들은 그림투스라는 난폭한 놈을 따르지.\n놈은 광산 입구를 지키고 있네. 끝장내게."
"Grimtooth is dead? The valley owes you, hero.": "그림투스가 죽었다고? 이 골짜기가 자네에게 빚을 졌군, 영웅이여."
