"WASD move  Q/E strafe  Space jump  Tab or click: target  1 Strike  F talk/gather": "WASD 이동  Q/E 옆걸음  Space 점프  Tab/클릭 대상 지정  1 일격  F 대화/채집"
"{0} complete!": "{0} 완료!"
"Return to {0}.": "{0}에게 돌아가세요."
"[{0} completed: +{1} xp]": "[{0} 완료: 경험치 +{1}]"
"Light be with you, friend.": "빛이 함께하길, 친구여."
"You have no use for that yet.": "아직은 쓸 데가 없다."
"You have reached level {0}!": "레벨 {0}에 도달했습니다!"
"You wake up at the abbey.": "수도원에서 깨어났습니다."
"You have died.": "쓰러졌습니다."
"+{0} xp": "경험치 +{0}"
"Welcome to Dawnvale. Speak with Captain Rowan at the abbey gate (F).": "던베일에 오신 것을 환영합니다. 수도원 문 앞의 로완 대장에게 말을 거세요 (F)."

# People and creatures
"Captain Rowan": "로완 대장"
"Sister Mira": "미라 수녀"
